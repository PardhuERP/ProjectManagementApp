<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Project Management
</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="header">

<h2>
🏗 Project Management
</h2>

</div>


  <div class="card">
  <h3>📐 Room Calculator</h3>

  <input id="room" placeholder="Room Name (Ex: Room 1)">

  <select id="roomType">
    <option value="">Select Room Type</option>
    <option>Bedroom</option>
    <option>Kitchen</option>
    <option>Hall</option>
    <option>Washroom</option>
    <option>Lounge</option>
    <option>Corridor</option>
    <option>Suite Room</option>
  </select>

  <label for="unit">Measurement Unit</label>
  <select id="unit" onchange="updateUnitLabels()">
    <option value="ft">Feet</option>
    <option value="mm">Millimeter</option>
  </select>

  <input id="length" type="number" min="0" step="any"
         placeholder="Room Length">

  <input id="width" type="number" min="0" step="any"
         placeholder="Room Width">

  <h3>🧱 Tile Calculator</h3>

  <label for="tileSize">Tile Size</label>
  <select id="tileSize" onchange="toggleCustomTile()">
    <option value="2x2">2 × 2 ft</option>
    <option value="2x4">2 × 4 ft</option>
    <option value="3x5">3 × 5 ft</option>
    <option value="4x2">4 × 2 ft</option>
    <option value="custom">Custom Size</option>
  </select>

    <label for="tilesPerBox">Tiles per Box</label>
<select id="tilesPerBox">
  <option value="2">2 Tiles / Box</option>
  <option value="3">3 Tiles / Box</option>
  <option value="4" selected>4 Tiles / Box</option>
  <option value="5">5 Tiles / Box</option>
</select>

  <div id="customTileFields" style="display:none">
    <input id="tileLength" type="number" min="0" step="any"
           placeholder="Tile Length (same unit as room)">

    <input id="tileWidth" type="number" min="0" step="any"
           placeholder="Tile Width (same unit as room)">
  </div>

  <label for="wastage">Extra tiles for cutting / wastage</label>
  <select id="wastage">
    <option value="0">0%</option>
    <option value="5" selected>5%</option>
    <option value="10">10%</option>
    <option value="15">15%</option>
  </select>

  <button onclick="calculate()">Calculate Room & Tiles</button>
  <button onclick="saveRoom()">Save Room</button>

  <div id="result"></div>

  <hr>

  <button onclick="plywoodCalculator()">🪵 Plywood Calculator</button>
  <button onclick="materials()">📦 Material Status</button>
  <button onclick="dailyReport()">📋 Daily Report</button>
  <button onclick="whatsapp()">📱 WhatsApp Report</button>
</div>


<script src="app.js">

</script>

</body>

</html>
